<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SCP-Pokémon classified anomaly archive">
<title>Foundation Anomaly Archive</title>
<style>
:root{--bg:#080a0c;--panel:#111619;--panel2:#182024;--ink:#dce2de;--muted:#8b9691;--line:#344148;--red:#d44747;--amber:#d6aa56;--green:#83dfa0;--paper:#d8d5c9;--paperInk:#151515;--max:1200px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% 0,#1a242a,#080a0c 48rem);color:var(--ink);font:15px/1.55 system-ui,sans-serif}a{color:inherit;text-decoration:none}.shell{max-width:var(--max);margin:auto;padding:0 1rem}.topbar{border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem}.brand{font-weight:800;letter-spacing:.12em;text-transform:uppercase}.brand small{display:block;color:var(--muted);font-size:.65rem;letter-spacing:.04em}.status{color:var(--green);font-size:.78rem}.hero{padding:4rem 0 2rem}.hero h1{font:clamp(2.3rem,7vw,5.3rem)/.95 Georgia,serif;letter-spacing:.04em;text-transform:uppercase;margin:.7rem 0}.hero p{color:var(--muted);max-width:680px}.badge{display:inline-block;border:1px solid var(--red);color:#ff9b9b;padding:.1rem .45rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.65rem;margin:1.5rem 0 1rem}.input,.button{background:var(--panel);border:1px solid var(--line);border-radius:3px;color:var(--ink);padding:.68rem .8rem}.input{min-width:160px;flex:1 1 170px}.button{cursor:pointer}.button:hover,.button:focus{border-color:var(--amber)}.button[disabled]{opacity:.4;cursor:not-allowed}.summary,.notice{color:var(--muted);padding:.7rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}.card{display:block;background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);padding:1rem;min-height:205px;transition:.15s}.card:hover{transform:translateY(-2px);border-color:var(--amber)}.card__top{display:flex;justify-content:space-between;align-items:center}.card h2{font:1.35rem Georgia,serif;margin:.4rem 0}.card p{color:var(--muted);margin:.3rem 0}.sprite{display:block;width:96px;height:96px;object-fit:contain;image-rendering:pixelated;margin:.25rem auto}.favorite{border:0;background:none;color:var(--muted);font-size:1.45rem;cursor:pointer}.favorite.active{color:#ffd166}.tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.6rem}.tag{color:var(--amber);font:.7rem ui-monospace,monospace}.tag-editor{display:flex;gap:.3rem;margin-top:.7rem}.small{font-size:.72rem;padding:.4rem}.pager{display:flex;justify-content:center;gap:.5rem;margin:1.5rem 0}.document{background:var(--paper);color:var(--paperInk);max-width:1000px;margin:1rem auto 3rem;padding:clamp(1rem,5vw,4rem);box-shadow:0 20px 70px #0009;font-family:Georgia,serif}.document.dark{background:#14191c;color:#dce2de;border:1px solid var(--line)}.doc-head{border-bottom:3px double currentColor;padding-bottom:1rem}.doc-id{font:700 1rem ui-monospace,monospace;letter-spacing:.08em}.doc-head h1{font-size:clamp(1.8rem,5vw,3.5rem);line-height:1.05;margin:.4rem 0}.classification{border:3px solid #912323;color:#912323;text-align:center;font:bold 1.1rem ui-monospace,monospace;padding:.5rem;margin:1.5rem 0;text-transform:uppercase}.dark .classification{color:#ff8585}.section{border-top:1px solid currentColor;margin-top:1.5rem;padding-top:1rem}.section h2{font-size:1rem;text-transform:uppercase;letter-spacing:.1em}.kv{display:grid;grid-template-columns:190px 1fr;border-bottom:1px dotted currentColor;padding:.35rem 0}.kv dt{font-weight:bold}.kv dd{margin:0}.sprite-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1rem}.sprite-box{background:#bbb8ae;color:#111;padding:.5rem;text-align:center;font:12px ui-monospace,monospace}.sprite-box img{display:block;width:100%;height:135px;object-fit:contain}.docnav{display:flex;justify-content:space-between;align-items:center;gap:.5rem;border-block:1px solid currentColor;padding:.75rem 0;margin:1rem 0;font-family:ui-monospace,monospace}.docnav-extra{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}.docnav .button,.docnav-extra .button{background:transparent;color:inherit;border-color:currentColor}.modal{border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:430px;width:calc(100% - 2rem)}.modal::backdrop{background:#000b;backdrop-filter:blur(3px)}.modal form{padding:1.25rem}.setting{display:flex;gap:.6rem;align-items:center;border-top:1px solid var(--line);padding:.8rem 0}.actions{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}footer{color:var(--muted);font-size:.8rem;padding:2rem 0}@media(max-width:600px){.kv{display:block}.kv dt{margin-top:.5rem}.docnav{font-size:.75rem}}
</style>
</head>
<body>
<header class="shell topbar"><a class="brand" href="#/">Foundation Archive<small>SCP-Pokémon anomaly registry</small></a><span id="status" class="status" aria-live="polite">Initializing…</span></header>
<main id="app" class="shell" tabindex="-1"></main>
<footer class="shell">Fictional archive interface. Pokémon names, data, and artwork remain the property of their respective owners.</footer>
<script type="module">
const CONFIG={manifest:'manifest.json',recordsDir:'scp-pokemon-records/'};
const KEY='scp-pokemon-archive-v2';
const defaults={favorites:[],tags:{},sort:'record-asc',classFilter:'all',categoryFilter:'all',favoritesOnly:false,showSprites:true,compact:false,theme:'paper'};
const state={records:[],query:'',settings:loadSettings()};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=v=>Array.isArray(v)?v.map(val).join(', '):v&&typeof v==='object'?Object.entries(v).map(([k,x])=>`${k}: ${val(x)}`).join('; '):esc(v);
function loadSettings(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY))}}catch{return {...defaults}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state.settings))}
function favorite(id){return state.settings.favorites.includes(id)}
function toggleFavorite(id){const s=new Set(state.settings.favorites);s.has(id)?s.delete(id):s.add(id);state.settings.favorites=[...s];save();render()}
function tags(id){return state.settings.tags[id]||[]}
function saveTags(id,raw){state.settings.tags[id]=[...new Set(raw.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean))];save()}
async function json(url){const r=await fetch(url,{cache:'no-cache'});if(!r.ok)throw Error(`${r.status}: ${url}`);return r.json()}
async function load(){const m=await json(CONFIG.manifest);let files=m.records||m.files||[];if(!files.length&&m.recordsCompleted)files=Array.from({length:m.recordsCompleted},(_,i)=>`SCP-PKMN-${String(i+1).padStart(4,'0')}.json`);return (await Promise.all(files.map(x=>json(CONFIG.recordsDir+(typeof x==='string'?x:x.path||x.file))))).flatMap(x=>Array.isArray(x)?x:[x])}
function route(){return location.hash.replace(/^#\/?/,'').split('/').filter(Boolean)}
function classes(){return [...new Set(state.records.map(x=>x.classification?.objectClass).filter(Boolean))].sort()}
function categories(){return [...new Set(state.records.map(x=>x.pokemon?.speciesCategory).filter(Boolean))].sort()}
function filtered(){const s=state.settings,q=state.query.toLowerCase();return state.records.filter(r=>{const p=r.pokemon||{},c=r.classification||{};const hay=[r.recordId,r.metadata?.title,r.description,p.speciesName,p.nickname,p.form,p.primaryType,p.secondaryType,p.speciesCategory,...tags(r.recordId)].filter(Boolean).join(' ').toLowerCase();return(!q||hay.includes(q))&&(s.classFilter==='all'||c.objectClass===s.classFilter)&&(s.categoryFilter==='all'||p.speciesCategory===s.categoryFilter)&&(!s.favoritesOnly||favorite(r.recordId))}).sort((a,b)=>{const pa=a.pokemon||{},pb=b.pokemon||{};switch(s.sort){case'record-desc':return b.recordId.localeCompare(a.recordId);case'species-asc':return String(pa.speciesName||'').localeCompare(String(pb.speciesName||''));case'species-desc':return String(pb.speciesName||'').localeCompare(String(pa.speciesName||''));case'class':return String(a.classification?.objectClass||'').localeCompare(String(b.classification?.objectClass||''));case'updated':return String(b.metadata?.lastUpdatedAt||'').localeCompare(String(a.metadata?.lastUpdatedAt||''));case'favorite':return Number(favorite(b.recordId))-Number(favorite(a.recordId));default:return a.recordId.localeCompare(b.recordId)}})}
function card(r){const p=r.pokemon||{},c=r.classification||{},f=favorite(r.recordId);return `<a class="card" href="#/record/${encodeURIComponent(r.recordId)}"><div class="card__top"><span class="badge">${esc(c.objectClass||'unclassified')}</span><button class="favorite ${f?'active':''}" data-fav="${esc(r.recordId)}" aria-label="${f?'Remove':'Add'} favorite">${f?'★':'☆'}</button></div>${state.settings.showSprites&&p.sprites?.frontNormal?`<img class="sprite" src="${esc(p.sprites.frontNormal)}" alt="${esc(p.speciesName)} front sprite" loading="lazy">`:''}<h2>${esc(r.recordId)}</h2><p>${esc(r.metadata?.title||p.speciesName||'Untitled')}</p><p>${esc(p.speciesName||'Unknown')} · ${esc(p.primaryType||'unknown')}</p><p>${esc(r.status?.operationalStatus||'unknown')}</p><div class="tags">${tags(r.recordId).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><label class="tag-editor" onclick="event.preventDefault()"><input class="input small" data-tag-input="${esc(r.recordId)}" value="${esc(tags(r.recordId).join(', '))}" placeholder="tags, comma-separated"><button class="button small" data-tag-save="${esc(r.recordId)}">Save</button></label></a>`}
function renderHome(){const rs=filtered(),cs=classes(),cats=categories();$('#app').innerHTML=`<section class="hero"><span class="badge">Restricted access</span><h1>Anomaly Registry</h1><p>Central archive for anomalous Pokémon entities. Search, classify, organize, and browse the records.</p></section><section class="toolbar"><label class="sr" for="search">Search</label><input class="input" id="search" type="search" placeholder="Search designation, species, title, type, tag…" value="${esc(state.query)}"><select class="input" id="class" aria-label="Object class"><option value="all">All object classes</option>${cs.map(x=>`<option value="${esc(x)}" ${state.settings.classFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="input" id="category" aria-label="Category"><option value="all">All categories</option>${cats.map(x=>`<option value="${esc(x)}" ${state.settings.categoryFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="input" id="sort" aria-label="Sort"><option value="record-asc">Designation ascending</option><option value="record-desc">Designation descending</option><option value="species-asc">Species A–Z</option><option value="species-desc">Species Z–A</option><option value="class">Object class</option><option value="updated">Recently updated</option><option value="favorite">Favorites first</option></select><button class="button" id="favfilter" aria-pressed="${state.settings.favoritesOnly}">${state.settings.favoritesOnly?'★ Favorites only':'☆ Show favorites'}</button><button class="button" id="random">Random Pokémon</button><button class="button" id="settings">Settings</button></section><div class="summary" aria-live="polite">Showing ${rs.length} of ${state.records.length} records</div><section class="grid ${state.settings.compact?'compact':''}" aria-label="Records">${rs.length?rs.map(card).join(''):'<p class="notice">No records match the current filters.</p>'}</section>`;$('#sort').value=state.settings.sort;$('#search').oninput=e=>{state.query=e.target.value;renderHome();$('#search')?.focus()};$('#class').onchange=e=>{state.settings.classFilter=e.target.value;save();renderHome()};$('#category').onchange=e=>{state.settings.categoryFilter=e.target.value;save();renderHome()};$('#sort').onchange=e=>{state.settings.sort=e.target.value;save();renderHome()};$('#favfilter').onclick=()=>{state.settings.favoritesOnly=!state.settings.favoritesOnly;save();renderHome()};$('#random').onclick=random;$('#settings').onclick=settings;document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();toggleFavorite(b.dataset.fav)});document.querySelectorAll('[data-tag-save]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();saveTags(b.dataset.tagSave,$(`[data-tag-input="${CSS.escape(b.dataset.tagSave)}"]`).value);renderHome()})}
function section(h,b){return `<section class="section"><h2>${h}</h2>${b}</section>`}function list(a,fn=x=>val(x)){return a?.length?`<ul>${a.map(x=>`<li>${fn(x)}</li>`).join('')}</ul>`:'<p>None recorded.</p>'}
function nav(id){const rs=filtered(),i=rs.findIndex(x=>x.recordId===id),p=rs[(i-1+rs.length)%rs.length],n=rs[(i+1)%rs.length];return `<nav class="docnav"><button class="button" data-prev ${rs.length<2?'disabled':''}>← Previous</button><span>${i+1} / ${rs.length}</span><button class="button" data-next ${rs.length<2?'disabled':''}>Next →</button></nav><div class="docnav-extra"><button class="button" data-random>Random Pokémon</button><button class="button" data-docfav>${favorite(id)?'★ Remove favorite':'☆ Add favorite'}</button><span>Previous: ${esc(p?.recordId||'—')} · Next: ${esc(n?.recordId||'—')}</span></div>`}
function renderDoc(id){const r=state.records.find(x=>x.recordId===id);if(!r){$('#app').innerHTML='<p class="notice">Record not found. <a href="#/">Return to archive.</a></p>';return}const p=r.pokemon||{},a=r.anomalousProperties||{},c=r.classification||{},co=r.containment||{},t=a.threatProfile||{},sp=p.sprites||{};const imgs=[['Front normal',sp.frontNormal],['Back normal',sp.backNormal],['Front shiny',sp.frontShiny],['Back shiny',sp.backShiny]].filter(x=>x[1]);$('#app').innerHTML=`<a href="#/">← Return to archive</a><article class="document ${state.settings.theme==='dark'?'dark':''}"><header class="doc-head"><div class="doc-id">${esc(r.recordId)}</div><h1>${esc(r.metadata?.title||p.speciesName)}</h1><div>${esc(r.metadata?.subtitle||'Anomalous entity dossier')}</div></header><div class="classification">Object class: ${esc(c.objectClass||'unknown')} · Risk: ${esc(c.riskClass||'unknown')}</div>${nav(id)}${section('Containment procedures',`<p>${val(co.specialContainmentProcedures)}</p><p>${val(co.handlingProcedures)}</p><p><b>Emergency:</b> ${val(co.emergencyProcedures)}</p>`)}${section('Description',`<p>${val(r.description)}</p><dl class="kv"><dt>Species</dt><dd>${val(p.speciesName)}</dd><dt>Form</dt><dd>${val(p.form)}</dd><dt>Types</dt><dd>${val([p.primaryType,p.secondaryType].filter(Boolean))}</dd><dt>Category</dt><dd>${val(p.speciesCategory)}</dd><dt>Height / weight</dt><dd>${val(p.heightMeters)} m / ${val(p.weightKilograms)} kg</dd><dt>Life stage / sex</dt><dd>${val(p.lifeStage)} / ${val(p.biologicalSex)}</dd></dl>`)}${state.settings.showSprites&&imgs.length?section('Visual records',`<div class="sprite-grid">${imgs.map(([l,u])=>`<figure class="sprite-box"><img src="${esc(u)}" alt="${esc(l)} sprite of ${esc(p.speciesName)}"><figcaption>${esc(l)}</figcaption></figure>`).join('')}</div>`):''}${section('Anomalous properties',`<p>${val(a.summary)}</p>${list(a.properties,x=>`<b>${val(x.name)}</b> — ${val(x.description)} [${val(x.severity)}]`)}`)}${section('Threat profile',`<dl class="kv"><dt>Overall threat</dt><dd>${val(t.overallThreatLevel)}</dd><dt>Hazards</dt><dd>${list(t.hazards,x=>`${val(x.type)}: ${val(x.description)}`)}</dd></dl>`)}${section('Abilities and moves',`<p><b>Abilities:</b> ${val((p.abilities||[]).map(x=>x.name))}</p><p><b>Known moves:</b> ${val((p.knownMoves||[]).map(x=>x.name))}</p>`)}${section('Record metadata',`<dl class="kv"><dt>Status</dt><dd>${val(r.status?.operationalStatus)}</dd><dt>Last verified</dt><dd>${val(r.status?.lastVerifiedAt)}</dd><dt>Author</dt><dd>${val(r.metadata?.author)}</dd><dt>Tags</dt><dd>${val(tags(id))}</dd></dl>`)}</article>`;$('#app').focus();document.querySelector('[data-prev]').onclick=()=>adj(id,-1);document.querySelector('[data-next]').onclick=()=>adj(id,1);document.querySelector('[data-random]').onclick=random;document.querySelector('[data-docfav]').onclick=()=>toggleFavorite(id)}
function adj(id,d){const r=filtered(),i=r.findIndex(x=>x.recordId===id);if(r.length)location.hash=`/record/${encodeURIComponent(r[(i+d+r.length)%r.length].recordId)}`}
function random(){const r=filtered();if(r.length)location.hash=`/record/${encodeURIComponent(r[Math.floor(Math.random()*r.length)].recordId)}`}
function settings(){const d=document.createElement('dialog');d.className='modal';d.innerHTML=`<form method="dialog"><h2>Archive settings</h2><label class="setting"><input id="setsprites" type="checkbox" ${state.settings.showSprites?'checked':''}> Show sprites</label><label class="setting"><input id="setcompact" type="checkbox" ${state.settings.compact?'checked':''}> Compact cards</label><label class="setting">Document theme <select class="input" id="settheme"><option value="paper">Classified paper</option><option value="dark">Dark terminal</option></select></label><div class="actions"><button class="button">Cancel</button><button class="button" id="saveSettings" value="default">Save</button></div></form>`;document.body.append(d);d.showModal();$('#settheme').value=state.settings.theme;$('#saveSettings').onclick=e=>{e.preventDefault();state.settings.showSprites=$('#setsprites').checked;state.settings.compact=$('#setcompact').checked;state.settings.theme=$('#settheme').value;save();d.close();render()};d.onclose=()=>d.remove()}
function render(){const r=route();r[0]==='record'&&r[1]?renderDoc(decodeURIComponent(r[1])):renderHome()}
addEventListener('hashchange',render);addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;const r=route();if(e.key==='/'&&!r.length){e.preventDefault();$('#search')?.focus()}if(e.key.toLowerCase()==='r')random();if(r[0]==='record'&&r[1]){if(e.key==='ArrowLeft')adj(decodeURIComponent(r[1]),-1);if(e.key==='ArrowRight')adj(decodeURIComponent(r[1]),1)}});
(async()=>{try{$('#status').textContent='Loading archive…';state.records=await load();$('#status').textContent=`${state.records.length} records loaded`;render()}catch(e){$('#status').textContent='Archive unavailable';$('#app').innerHTML=`<p class="notice"><b>Unable to load archive.</b><br>${esc(e.message)}<br><br>Serve this folder with <code>python -m http.server 8000</code>; fetch is blocked from file:// URLs.</p>`}})();
</script>
</body>
</html>
