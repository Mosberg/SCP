<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Secure anomaly archive" />
    <title>Foundation Anomaly Archive</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080a0c;
        --panel: #111519;
        --panel2: #171c20;
        --ink: #d8ddd9;
        --muted: #87918d;
        --red: #d63d3d;
        --amber: #d4a24c;
        --line: #344047;
        --max: 1200px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(
          circle at 50% 0,
          #182026 0,
          var(--bg) 48rem
        );
        color: var(--ink);
        font:
          15px/1.55 system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      a {
        color: inherit;
      }
      .shell {
        max-width: var(--max);
        margin: auto;
        padding: 1rem;
      }
      .topbar {
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: center;
        padding: 0.8rem 0;
      }
      .brand {
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .brand small {
        display: block;
        color: var(--muted);
        font-size: 0.65rem;
        letter-spacing: 0.04em;
      }
      .status {
        color: #7ee09b;
        font-size: 0.78rem;
      }
      .hero {
        padding: 4rem 0 2rem;
      }
      .hero h1 {
        font:
          clamp(2.2rem, 6vw, 5rem)/0.95 Georgia,
          serif;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin: 0 0 1rem;
      }
      .hero p {
        max-width: 650px;
        color: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin: 2rem 0;
      }
      .input,
      .button {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--ink);
        padding: 0.7rem 0.85rem;
      }
      .input {
        min-width: 240px;
        flex: 1;
      }
      .button {
        cursor: pointer;
      }
      .button:hover,
      .button:focus {
        border-color: var(--amber);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 1rem;
      }
      .card {
        background: linear-gradient(145deg, var(--panel2), var(--panel));
        border: 1px solid var(--line);
        padding: 1rem;
        min-height: 190px;
        transition:
          transform 0.15s,
          border-color 0.15s;
      }
      .card:hover {
        transform: translateY(-2px);
        border-color: var(--amber);
      }
      .card h2 {
        font:
          1.4rem Georgia,
          serif;
        margin: 0.3rem 0;
      }
      .card p {
        color: var(--muted);
        margin: 0.35rem 0;
      }
      .badge {
        display: inline-block;
        border: 1px solid var(--red);
        color: #ff9a9a;
        padding: 0.1rem 0.4rem;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .document {
        background: #d8d5c9;
        color: #161616;
        max-width: 1000px;
        margin: 2rem auto;
        padding: clamp(1rem, 4vw, 4rem);
        box-shadow: 0 18px 60px #0008;
        font-family: Georgia, serif;
      }
      .doc-head {
        border-bottom: 3px double #333;
        padding-bottom: 1rem;
        margin-bottom: 1.5rem;
      }
      .doc-head h1 {
        font-size: clamp(1.8rem, 4vw, 3.5rem);
        margin: 0.3rem 0;
      }
      .doc-id {
        font:
          700 1rem/1.2 ui-monospace,
          monospace;
        letter-spacing: 0.08em;
      }
      .classification {
        border: 3px solid #8b2020;
        color: #8b2020;
        text-align: center;
        font:
          bold 1.2rem ui-monospace,
          monospace;
        padding: 0.5rem;
        margin: 1.5rem 0;
        text-transform: uppercase;
      }
      .doc-section {
        border-top: 1px solid #777;
        margin-top: 1.5rem;
        padding-top: 1rem;
      }
      .doc-section h2 {
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .kv {
        display: grid;
        grid-template-columns: 190px 1fr;
        border-bottom: 1px dotted #999;
        padding: 0.35rem 0;
      }
      .kv dt {
        font-weight: bold;
      }
      .kv dd {
        margin: 0;
      }
      .sprite-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 1rem;
      }
      .sprite {
        background: #bbb8ae;
        padding: 0.5rem;
        text-align: center;
        font:
          12px ui-monospace,
          monospace;
      }
      .sprite img {
        display: block;
        width: 100%;
        height: 130px;
        object-fit: contain;
        image-rendering: auto;
      }
      .redacted {
        background: #111;
        color: #111;
        padding: 0 0.25em;
      }
      .danger {
        color: #9e1919;
      }
      .back {
        margin: 1rem 0;
      }
      .notice {
        border: 1px solid var(--line);
        padding: 1rem;
        color: var(--muted);
      }
      footer {
        color: var(--muted);
        font-size: 0.8rem;
        padding: 3rem 0 1rem;
      }
      @media (max-width: 600px) {
        .kv {
          display: block;
        }
        .kv dt {
          margin-top: 0.4rem;
        }
        .document {
          margin: 1rem 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="shell topbar">
      <a class="brand" href="#/"
        >Foundation Archive<small>SCP-Pokémon anomaly registry</small></a
      ><span id="status" class="status" aria-live="polite">Initializing…</span>
    </header>
    <main id="app" class="shell" tabindex="-1"></main>
    <footer class="shell">
      For fictional documentation and local archive use. Pokémon data and
      artwork remain subject to their respective copyrights and licenses.
    </footer>
    <script type="module">
      const CONFIG = {
        manifest: "manifest.json",
        base: "",
        recordsDir: "scp-pokemon-records/",
      };
      const state = { records: [], error: null, query: "", classFilter: "all" };
      const $ = (s) => document.querySelector(s);
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const text = (v) =>
        Array.isArray(v)
          ? v.map(text).join(", ")
          : typeof v === "object" && v
            ? Object.entries(v)
                .map(([k, x]) => `${k}: ${text(x)}`)
                .join("; ")
            : esc(v);
      async function getJson(url) {
        const r = await fetch(url, { cache: "no-cache" });
        if (!r.ok) throw new Error(`${r.status} ${url}`);
        return r.json();
      }
      async function loadRecords() {
        const manifest = await getJson(CONFIG.base + CONFIG.manifest);
        let files = manifest.files || manifest.records || [];
        if (!files.length && manifest.recordsCompleted) {
          files = Array.from(
            { length: manifest.recordsCompleted },
            (_, i) => `SCP-PKMN-${String(i + 1).padStart(4, "0")}.json`,
          );
        }
        const records = await Promise.all(
          files.map((f) =>
            getJson(
              CONFIG.base +
                (typeof f === "string"
                  ? CONFIG.recordsDir + f
                  : f.path || f.file),
            ),
          ),
        );
        return records.flatMap((x) => (Array.isArray(x) ? x : [x]));
      }
      function route() {
        return location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
      }
      function setStatus(s) {
        $("#status").textContent = s;
      }
      function render() {
        const r = route();
        r[0] === "record" && r[1]
          ? renderDocument(decodeURIComponent(r[1]))
          : renderHome();
      }
      function renderHome() {
        const classes = [
          ...new Set(
            state.records
              .map((r) => r.classification?.objectClass)
              .filter(Boolean),
          ),
        ].sort();
        const q = state.query.toLowerCase();
        const rows = state.records.filter((r) => {
          const p = r.pokemon || {},
            c = r.classification || {};
          return (
            (c.objectClass === state.classFilter ||
              state.classFilter === "all") &&
            `${r.recordId} ${r.metadata?.title} ${p.speciesName} ${p.nickname}`
              .toLowerCase()
              .includes(q)
          );
        });
        $("#app").innerHTML =
          `<section class="hero"><span class="badge">Restricted access</span><h1>Anomaly Registry</h1><p>Central archive for anomalous Pokémon entities. Select a record to open its classified containment dossier.</p></section><section aria-label="Archive controls" class="controls"><input class="input" id="search" type="search" placeholder="Search designation, species, title…" value="${esc(state.query)}"><select class="input" id="class"><option value="all">All classifications</option>${classes.map((x) => `<option ${x === state.classFilter ? "selected" : ""} value="${esc(x)}">${esc(x)}</option>`).join("")}</select><span class="notice">${rows.length} of ${state.records.length} records</span></section><section class="grid" aria-label="Anomaly records">${rows.map(card).join("") || '<p class="notice">No matching records.</p>'}</section>`;
        $("#search").addEventListener("input", (e) => {
          state.query = e.target.value;
          render();
        });
        $("#class").addEventListener("change", (e) => {
          state.classFilter = e.target.value;
          render();
        });
      }
      function card(r) {
        const p = r.pokemon || {},
          c = r.classification || {};
        return `<a class="card" href="#/record/${encodeURIComponent(r.recordId)}"><span class="badge">${esc(c.objectClass || "unclassified")}</span><h2>${esc(r.recordId)}</h2><p>${esc(r.metadata?.title || p.speciesName || "Untitled entity")}</p><p>${esc(p.speciesName || "Unknown species")} · ${esc(p.primaryType || "unknown")}</p><p>${esc(r.status?.operationalStatus || "status unknown")}</p></a>`;
      }
      function section(title, body) {
        return `<section class="doc-section"><h2>${title}</h2>${body}</section>`;
      }
      function list(items, fn = (x) => text(x)) {
        return items?.length
          ? `<ul>${items.map((x) => `<li>${fn(x)}</li>`).join("")}</ul>`
          : "<p>None recorded.</p>";
      }
      function renderDocument(id) {
        const r = state.records.find((x) => x.recordId === id);
        if (!r) {
          $("#app").innerHTML =
            '<p class="notice">Record not found. <a href="#/">Return to archive.</a></p>';
          return;
        }
        const p = r.pokemon || {},
          a = r.anomalousProperties || {},
          c = r.classification || {},
          co = r.containment || {},
          t = a.threatProfile || {};
        const sprites = p.sprites || {};
        const spriteData = [
          ["Front — normal", sprites.frontNormal],
          ["Back — normal", sprites.backNormal],
          ["Front — shiny", sprites.frontShiny],
          ["Back — shiny", sprites.backShiny],
        ].filter((x) => x[1]);
        $("#app").innerHTML =
          `<a class="back" href="#/">← Return to archive</a><article class="document"><header class="doc-head"><div class="doc-id">${esc(r.recordId)}</div><h1>${esc(r.metadata?.title || p.speciesName)}</h1><div>${esc(r.metadata?.subtitle || "Anomalous entity dossier")}</div></header><div class="classification">Object class: ${esc(c.objectClass || "unclassified")} · Risk: ${esc(c.riskClass || "unknown")}</div>${section("Containment procedures", `<p>${text(co.specialContainmentProcedures)}</p><p>${text(co.handlingProcedures)}</p><p><strong>Emergency:</strong> ${text(co.emergencyProcedures)}</p>`)}${section("Description", `<p>${text(r.description)}</p><dl class="kv"><dt>Species</dt><dd>${text(p.speciesName)}</dd><dt>Form</dt><dd>${text(p.form)}</dd><dt>Types</dt><dd>${text([p.primaryType, p.secondaryType].filter(Boolean))}</dd><dt>Life stage</dt><dd>${text(p.lifeStage)}</dd><dt>Sex</dt><dd>${text(p.biologicalSex)}</dd><dt>Height / weight</dt><dd>${text(p.heightMeters)} m / ${text(p.weightKilograms)} kg</dd></dl>`)}${spriteData.length ? section("Visual records", `<div class="sprite-grid">${spriteData.map(([label, url]) => `<figure class="sprite"><img loading="lazy" src="${esc(url)}" alt="${esc(label)} sprite of ${esc(p.speciesName)}"><figcaption>${esc(label)}</figcaption></figure>`).join("")}</div>`) : ""}${section("Anomalous properties", `<p>${text(a.summary)}</p>${list(a.properties, (x) => `<strong>${text(x.name)}</strong> — ${text(x.description)} [${text(x.severity)}]`)}`)}${section("Threat profile", `<dl class="kv"><dt>Overall threat</dt><dd class="danger">${text(t.overallThreatLevel)}</dd><dt>Hazards</dt><dd>${list(t.hazards, (x) => `${text(x.type)}: ${text(x.description)}`)}</dd></dl>`)}${section("Abilities and moves", `<p><strong>Abilities:</strong> ${text((p.abilities || []).map((x) => x.name))}</p><p><strong>Known moves:</strong> ${text((p.knownMoves || []).map((x) => x.name))}</p>`)}${section("Record metadata", `<dl class="kv"><dt>Status</dt><dd>${text(r.status?.operationalStatus)}</dd><dt>Last verified</dt><dd>${text(r.status?.lastVerifiedAt)}</dd><dt>Source author</dt><dd>${text(r.metadata?.author)}</dd></dl>`)}</article>`;
        $("#app").focus();
      }
      window.addEventListener("hashchange", render);
      (async () => {
        try {
          setStatus("Loading archive…");
          state.records = await loadRecords();
          setStatus(`${state.records.length} records loaded`);
          render();
        } catch (e) {
          state.error = e;
          setStatus("Archive unavailable");
          $("#app").innerHTML =
            `<p class="notice"><strong>Unable to load archive.</strong><br>${esc(e.message)}<br><br>Run this site through a local HTTP server; fetch() is blocked from file:// URLs.</p>`;
        }
      })();
    </script>
  </body>
</html>
