<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCP Document File</title>

    <meta
      name="description"
      content="SCP Document File — Level 4 Clearance Required"
    />
    <meta property="og:title" content="SCP Document File" />
    <meta property="og:image" content="assets/icon/scp.webp" />

    <link rel="icon" type="image/png" href="assets/icon/scp.webp" />
    <link rel="stylesheet" href="styles/styles.css" />
    <script defer src="scripts/main.js"></script>
  </head>

  <body class="page page-viewer">
    <header class="header">
      <div class="header-left">
        <h1>SCP DOCUMENT FILE</h1>
        <p>Foundation Secure Database — Level 4 Clearance Required</p>
      </div>
      <div class="header-right">
        <button id="settings-toggle" class="settings-btn">⚙ Settings</button>
      </div>
    </header>

    <aside id="settings-panel" class="settings-panel hidden">
      <h2>Viewer Settings</h2>
      <label
        ><input type="checkbox" id="setting-sounds" /> Enable terminal
        sounds</label
      >
      <label
        ><input type="checkbox" id="setting-overlay" /> Enable terminal overlay
        warnings</label
      >
      <label
        ><input type="checkbox" id="setting-redactions" /> Reveal redactions on
        hover</label
      >
      <button id="settings-close" class="settings-close-btn">Close</button>
    </aside>

    <div id="scp-doc" class="scp-doc fade-in"></div>

    <div id="terminal-overlay" class="terminal-overlay hidden">
      <div class="terminal-window flicker">
        <p>> ACCESSING CLASSIFIED FILE...</p>
        <p>> USER AUTHORIZATION: <span class="red">DENIED</span></p>
        <p>> LOGGING UNAUTHORIZED ACCESS ATTEMPT</p>
        <p class="blink">█</p>
      </div>
      <audio id="terminal-beep" src="assets/beep.mp3"></audio>
    </div>
  </body>
</html>
